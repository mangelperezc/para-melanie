<!DOCTYPE html>
<html>
<head>
    <title>Para Melanie ❤️</title>
    <style>
        body {
            background: linear-gradient(135deg, #ffdde1, #ee9ca7);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Georgia', serif;
            margin: 0;
        }

        .container {
            text-align: center;
        }

        .envelope {
            width: 220px;
            height: 160px;
            background: #ffffff;
            position: relative;
            cursor: pointer;
            border-radius: 12px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .envelope:hover {
            transform: scale(1.05);
        }

        .envelope:before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 110px solid transparent;
            border-right: 110px solid transparent;
            border-bottom: 80px solid #ff4d6d;
            border-radius: 12px 12px 0 0;
        }

        .letter {
            display: none;
            margin-top: 25px;
            background: white;
            padding: 25px;
            border-radius: 15px;
            width: 340px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.25);
            animation: fadeIn 1s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px);}
            to { opacity: 1; transform: translateY(0);}
        }

        h1 {
            color: #ff4d6d;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="envelope" onclick="openLetter()"></div>
    <p>Haz click en la carta 💌</p>

    <div class="letter" id="letter">
        <h1>Para Melanie ❤️</h1>
        <p>
            Aquí escribiré todo lo que siento por ti...
        </p>
        <p>
            Con cariño,<br>
            Miguel Ángel
        </p>
    </div>
</div>

<script>
function openLetter() {
    document.getElementById("letter").style.display = "block";
}
</script>

</body>
</html>
